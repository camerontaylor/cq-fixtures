name: suite

# Invariant I4: the `on:` block below carries NO filter keys — no `paths`, no
# `paths-ignore`, no branch or tag filters. push and pull_request run the
# `smoke` job unfiltered (the denylist self-test's workflow sanity scan reads
# this block, and unfiltered push runs keep the smoke green on main);
# `workflow_dispatch` and the WEEKLY `schedule` declare the real-driver
# matrix's triggers (plan §9 weekly cadence, J4: the J3 daily cron was
# reduced to a Monday-morning run now that the matrix is live; dispatch stays
# for on-demand runs). Declaring events is not filtering: the `matrix` job
# ADDITIONALLY self-restricts to dispatch/schedule via its job-level `if`, so
# push/PR runs never attempt a live eval while the `on:` block itself stays
# free of filters.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Plan §9 weekly cadence: 03:17 UTC every Monday. workflow_dispatch stays
    # the on-demand path (an eval re-run never waits for the window).
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Pack cq-toolkit at toolkit.lock tag
        run: ./scripts/pack-toolkit.sh
      - name: Install dependencies
        run: npm ci
      - name: Fake-driver smoke over the micro suites
        # Goal J4 replaced the J3 hard-fail seam with the REAL smoke: both
        # micro suites run under the FakeDriver — zero network, zero spend —
        # proving the whole pipeline (suite load, payload injection, judge
        # spawn, scoring, journal, aggregation) stays wired on every push and
        # every PR. The fake claims --driver-name subprocess per the recorded
        # J3 decision (suites/README.md): the fake stands in for a local CLI
        # transport, so `subprocess` is the honest lane label — never
        # `ai-sdk`, the paid eval axis. --check-timeout-ms 120000 gives the
        # judge's internal 45s vitest ceiling generous headroom.
        #
        # EXIT DISCIPLINE: rc 0 (no row scored zero) and rc 1 (the suite
        # SCORED ZERO somewhere) are BOTH smoke-green. rc 1 is the honest
        # fake outcome here — and in practice BOTH suites exit 1: the fake
        # cannot fix fixtures (every fixer row scores zero across its two
        # DD-4 probes), and its hardcoded 'resolved' verdict misses the 8
        # non-resolved-expected classifier cases. A scored-zero fake run IS
        # the success signal; rc >= 2 (usage error, suite load/validation
        # failure, fixture materialization failure, pre-dispatch
        # missing-credential) is a hard failure.
        run: |
          set -euo pipefail
          hard_fail=0
          for role_dir in suites/fixer-worker suites/review-classifier; do
            suite_dir="${role_dir}/micro"
            role="$(basename "${role_dir}")"
            out_dir="reports/smoke/${role}"
            rc=0
            node --experimental-strip-types runner/index.ts \
              --suite "${suite_dir}" \
              --driver fake \
              --driver-name subprocess \
              --model glm-5.3-flash \
              --provider zai \
              --check-timeout-ms 120000 \
              --journal "${out_dir}/journal" \
              --out "${out_dir}" || rc=$?
            if [ "${rc}" -ge 2 ]; then
              echo "::error::smoke ${suite_dir}: runner usage/validation failure (exit ${rc})"
              hard_fail=1
            elif [ "${rc}" -eq 1 ]; then
              echo "::notice::smoke ${suite_dir}: scored zero — the honest fake outcome (the fake cannot fix)"
            fi
            # cliMain's exit 1 CONFLATES two things: a scored-zero run
            # (benign — the suite completed and emitted its table) and a
            # run-phase throw mid-scoring/journal/validation (tables missing
            # or partial). rc 1 is benign ONLY when the suite completed
            # emission — its per-role table exists, including the
            # empty-but-valid budget-gated form — so the workflow re-checks
            # instead of trusting the code: a missing table is a run-phase
            # failure and hard-fails like rc>=2.
            if [ ! -f "${out_dir}/${role}.table.json" ]; then
              hard_fail=1
              echo "::error::smoke ${suite_dir}: rc ${rc} but no ${role}.table.json emitted — run-phase failure, not a scored outcome"
            fi
          done
          exit "${hard_fail}"
      - name: Upload smoke reports
        # if: always(): a hard-failed smoke (rc>=2) still uploads whatever
        # journals/tables were written before the failure — triage evidence
        # for the case that broke the run.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-reports
          path: reports/smoke/
          if-no-files-found: ignore

  # Real drivers, dispatch/schedule ONLY: the job-level `if` is the one
  # allowed restriction here (the `on:` block above remains unfiltered — a
  # job-level `if` removes whole runs by event, which is queue/mechanics
  # territory, not an I4 trigger filter).
  matrix:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # A skipped acp lane (the preflight's honest blocked outcome) must be
    # visible to the snapshot job: a skip leaves needs.matrix.result at
    # 'success' (skip is not failure), and the snapshot's clear-on-success
    # would then wipe any earlier same-day acp tables from an authenticated
    # run — the absent lane retroactively vanishing from published data
    # (cycle-2 r1 finding 6). Exported so the snapshot treats a skip as a
    # degraded run: merge, never clear.
    outputs:
      acp_skipped: ${{ steps.acp_preflight.outputs.skip == 'true' }}
    # Model-driven code runs here and this job pushes nothing (the snapshot
    # publisher is the dedicated `snapshot` job), so read is enough.
    permissions:
      contents: read
    strategy:
      # One cell's hard failure must not kill the other cell's eval: the
      # surviving cell's tables are still real evidence and still land in the
      # artifacts/snapshots.
      fail-fast: false
      matrix:
        # THE J5 AXES MATRIX (ADR-0001 as revised 2026-09-14): axis 1 —
        # models vary on the ai-sdk driver; axis 2 — drivers vary on the
        # FIXED served GLM id glm-5.3-flash, over Z.AI only. Five cells: two
        # model-axis cells (ai-sdk @ glm-5.3-flash, ai-sdk @ deepseek-chat)
        # and three driver-axis cells (claude-agent / subprocess / acp @
        # glm-5.3-flash @ zai — the four-wide driver axis minus ai-sdk
        # itself). The ai-sdk@glm-5.3-flash cell carries BOTH axes'
        # evidence — it is the axis-1 model cell AND the driver axis's
        # ai-sdk point — so it runs once, not once per axis. Every
        # non-ai-sdk cell pins model glm-5.3-flash, and the runner's axis
        # guard (runner/cli.ts) refuses any other pairing per invocation;
        # `axis` records which axis a cell varies (bookkeeping, not a
        # runner input).
        #
        # LANE PREREQUISITES: the claude-agent lane needs NO install step —
        # its optional peer @anthropic-ai/claude-agent-sdk ships as a
        # devDependency (npm ci provides it). The subprocess lane spawns the
        # headless `claude` CLI (installed below); the acp lane spawns the
        # zcode-acp-server harness (installed below, version-pinned).
        #
        # Budget by TOKENS (--max-tokens 200000), not USD: glm-5.3-flash@zai
        # is ABSENT from the toolkit price map and the governor FAILS CLOSED
        # on unpriced usage under a USD cap (it would refuse admission after
        # the first case of any multi-case suite — the exact failure DD-9
        # exists to prevent), and deepseek pricing must not be assumed
        # either. A token cap binds alone on every cell, keeping them
        # dispatch-safe; the USD cap is reserved for priced lanes that opt
        # into one.
        cell:
          - axis: model
            model: glm-5.3-flash
            provider: zai
            driver: ai-sdk
            env_key: ZAI_API_KEY
            secret_name: Z_AI_API_KEY
          - axis: model
            model: deepseek-chat
            provider: deepseek
            driver: ai-sdk
            env_key: DEEPSEEK_API_KEY
            secret_name: DEEPSEEK_API_KEY
          - axis: driver
            model: glm-5.3-flash
            provider: zai
            driver: claude-agent
            env_key: ZAI_API_KEY
            secret_name: Z_AI_API_KEY
          - axis: driver
            model: glm-5.3-flash
            provider: zai
            driver: subprocess
            env_key: ZAI_API_KEY
            secret_name: Z_AI_API_KEY
          - axis: driver
            model: glm-5.3-flash
            provider: zai
            driver: acp
            env_key: ZAI_API_KEY
            secret_name: Z_AI_API_KEY
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Model-driven code runs in this job (fixer cells get read/edit/run
          # tools) — it must not see persisted checkout credentials; report
          # tables leave via artifact, and the snapshot push lives in the
          # dedicated `snapshot` job below.
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Pack cq-toolkit at toolkit.lock tag
        run: ./scripts/pack-toolkit.sh
      - name: Install dependencies
        run: npm ci
      - name: Excise the unit-test tree and git objects (review-debt 11)
        # The matrix job never runs vitest, but test/micro.test.ts carries the
        # micro suites' REFERENCE FIXES: a model-driven worker with
        # host-privileged tools must not be able to read them out of the
        # checkout it works in (answer lookup). So the tree is removed before
        # ANY model-facing step, in EVERY cell (this step is unconditional).
        # .git goes too: even a fetch-depth-1 clone's object store holds the
        # HEAD tree's blobs, so `git show HEAD:test/micro.test.ts` would
        # recover the excised file from .git without the network
        # (persist-credentials: false already keeps the token out; the
        # objects are the residual channel). Nothing else breaks: the runner
        # is self-contained under runner/ (test/cli.test.ts imports nothing
        # the runner needs), the eval step uses no git, and pack-toolkit.sh
        # clones fresh from the remote into its own temp dir.
        run: |
          set -euo pipefail
          echo "excising test/ and .git — the micro suites' reference fixes (test/micro.test.ts) must not be readable by model-driven workers from the worktree OR the object store (review-debt #11)"
          rm -rf test/ .git
      # LANE INSTALLS (conditional): each lane brings only its own harness.
      # The claude-agent lane deliberately has NO install step here — its
      # optional peer @anthropic-ai/claude-agent-sdk ships as a devDependency
      # (npm ci provides it), so `--driver claude-agent` works out of the box.
      - name: Install the subprocess lane CLI
        if: matrix.cell.driver == 'subprocess'
        # The subprocess lane spawns `claude` (the toolkit SubprocessDriver's
        # binary default) pointed at Z.AI's anthropic-compat endpoint — the
        # headless CLI is the claude-code package, PINNED to the exact 2.x
        # version npm resolves today (2.1.276, 2026-09-19; registry-resolved
        # at J5 — the first dispatch is the live probe), consistent with the
        # zcode-acp-server pin below.
        run: npm install -g @anthropic-ai/claude-code@2.1.276
      - name: Install the acp lane harness
        if: matrix.cell.driver == 'acp'
        # PINNED to the probed version (2026-09-19, 0.43.3): >=0.43 moved the
        # editor-facing stdio ACP bridge into the `server` subcommand (the
        # bare bin opens its interactive TUI), and the runner passes the
        # explicit argv ['zcode-acp-server', 'server'] (runner/cli.ts
        # ACP_COMMAND) — so the installed harness must be the
        # subcommand-capable line.
        run: npm install -g zcode-acp-server@0.43.3
      - name: ACP headless auth preflight
        id: acp_preflight
        if: matrix.cell.driver == 'acp'
        # CREDENTIAL ASYMMETRY: the OTHER four cells' keys are repo secrets —
        # their absence is a misconfiguration and hard-fails pre-dispatch in
        # the runner (exit 2). The acp lane's credentials are AGENT-SIDE (the
        # zcode harness reads its own zcode-credentials app-side), and CI's
        # single GitHub identity cannot provision them from repo secrets — so
        # a blocked acp lane is an honest outcome: skip LOUDLY but green (the
        # lane is absent from the run, never published as data). The probe
        # below speaks the minimal ACP round over stdio — initialize
        # (protocolVersion 1, the ACP convention, clientCapabilities {}),
        # session/new (fresh mkdtemp cwd, mcpServers []), then session/prompt
        # — under `timeout 150` (the step keeps its own default timeout).
        # Exit-status discipline (cycle-2 review): ONLY the confirmed
        # no-agent-output class skips — fail() (a JSON-RPC error or a close
        # before any agent line, exit 3) and the timeout's 124, which the
        # wrapper maps to 3. Both sides probed live (2026-09-19): WITH
        # credentials the harness streams the agent's agent_message_chunk and
        # the probe exits 0; WITHOUT them the harness fast-fails the prompt
        # with a json-rpc error naming the missing model config ("zcode
        # create failed: Model config is missing …") — rc 3, the skip class.
        # Everything else propagates as a HARD failure: a spawn error exits 4
        # (install/spawn infrastructure) and any other non-zero (a script
        # crash, an unexpected status) is never caught into the skip path —
        # the step errors, so a broken preflight can never silently omit the
        # acp lane.
        run: |
          set -euo pipefail
          rc=0
          timeout 150 node -e '
            const { spawn } = require("node:child_process");
            const { mkdtempSync } = require("node:fs");
            const { tmpdir } = require("node:os");
            const { join } = require("node:path");
            const child = spawn("zcode-acp-server", ["server"], { stdio: ["pipe", "pipe", "pipe"] });
            const stderr = [];
            child.stderr.on("data", (d) => { stderr.push(d.toString()); if (stderr.length > 40) stderr.shift(); });
            let stage = 0; // 0 initialize sent, 1 session/new sent, 2 prompt sent
            const fail = (why) => {
              console.error("acp preflight FAILED: " + why);
              if (stderr.length > 0) console.error(stderr.join(""));
              process.exit(3);
            };
            child.on("error", (e) => { console.error("acp preflight FAILED: spawn error: " + e.message); process.exit(4); });
            // close, not exit: close fires after stdio flushes, so an agent
            // line arriving just before the harness dies is still processed
            // by the stdout handler above — and any close the success path
            // did not preempt is an auth-FAIL, unconditionally (a stage
            // guard would hang a stage-2 close until the timeout instead).
            child.on("close", (code) => fail("harness closed (code " + code + ") without any agent output"));
            // A dying harness must not surface as an unhandled EPIPE on the
            // queued send()s — close/timeout own the verdict (cycle-1 r1
            // finding 3): the error listener absorbs it.
            child.stdin.on("error", () => {});
            const send = (m) => child.stdin.write(JSON.stringify(m) + "\n");
            send({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: 1, clientCapabilities: {} } });
            let out = "";
            child.stdout.on("data", (d) => {
              out += d.toString();
              let i;
              while ((i = out.indexOf("\n")) !== -1) {
                const line = out.slice(0, i).trim();
                out = out.slice(i + 1);
                if (line === "") continue;
                let msg;
                // Auth-OK is a JSON-RPC MESSAGE at stage 2 — never any
                // parsed-less stdout line: a login-blocked harness that
                // narrates to stdout ("visit … to log in") must NOT flip the
                // cell to authenticated (cycle-2 r1 finding 1) — the timeout
                // owns non-JSON output.
                try { msg = JSON.parse(line); } catch { continue; }
                if (msg.error !== undefined) fail("json-rpc error before any agent output: " + JSON.stringify(msg.error));
                if (stage === 0 && msg.id === 1) {
                  stage = 1;
                  send({ jsonrpc: "2.0", id: 2, method: "session/new", params: { cwd: mkdtempSync(join(tmpdir(), "acp-preflight-")), mcpServers: [] } });
                } else if (stage === 1 && msg.id === 2) {
                  stage = 2;
                  send({ jsonrpc: "2.0", id: 3, method: "session/prompt", params: { sessionId: msg.result.sessionId, prompt: [{ type: "text", text: "Reply with the single word ready." }] } });
                } else if (stage === 2) {
                  // Auth-OK is the AGENT'S OWN REPLY (agent_message_chunk) —
                  // a session/protocol message alone proves nothing: probed
                  // live (2026-09-19), the harness streams bookkeeping like
                  // available_commands_update with ZERO credentials, so only
                  // the reply is accepted; bookkeeping keeps waiting and the
                  // timeout owns it (skip class).
                  const upd = msg.params && msg.params.update;
                  if (upd !== undefined && upd.sessionUpdate === "agent_message_chunk") {
                    console.log(line);
                    process.exit(0);
                  }
                }
              }
            });
          ' || rc=$?
          # 124 = the window expired with zero agent output — the same
          # honest class (observed: the credential-less harness fails FAST
          # with a json-rpc error, so 124 is the slow-wait fallback, mapped
          # into the skip class like its fast sibling).
          if [ "${rc}" -eq 124 ]; then
            rc=3
          fi
          if [ "${rc}" -eq 3 ]; then
            echo "::warning::acp cell blocked: no headless agent credentials (zcode-credentials cannot be provisioned from repo secrets)"
            echo "acp lane skipped: no headless agent credentials in CI (agent-side auth) — the lane is honestly absent from this run, never published as data" >> "${GITHUB_STEP_SUMMARY}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          elif [ "${rc}" -ne 0 ]; then
            # Spawn failures (4), script crashes, any unexpected status: a
            # broken preflight must never silently omit the acp lane — fail.
            echo "::error::acp preflight failed (rc ${rc}) — infrastructure, not a credential skip"
            exit 1
          fi
      # CREDENTIAL PREREQUISITE (the J3 BLOCKED note, carried forward): both
      # secret NAMES must exist in THIS repo's Actions settings — Z_AI_API_KEY
      # (the zai key) and DEEPSEEK_API_KEY. A missing or empty secret maps to
      # '' below, which the toolkit's requireKey rejects exactly like an
      # unset var, so the cell aborts PRE-DISPATCH with exit 2 (hard failure)
      # instead of publishing zero-scored tables while green.
      #
      # ACCEPTED RISK (recorded): the provider API key sits in this job's
      # env — and fixer cells hand model-driven workers read/edit/run tools
      # — so a prompt-injected worker could exfiltrate the key from the
      # process environment. Accepted because suite prompts are first-party
      # fixtures (provenance-marked, no third-party content). Owner action
      # tracked: move cells to a spend-capped, ephemeral eval key. The
      # credential split already keeps repo write access out of this job
      # (persist-credentials: false).
      - name: Eval cell — ${{ matrix.cell.model }} @ ${{ matrix.cell.provider }} on ${{ matrix.cell.driver }}
        # The acp cell runs ONLY if the preflight above proved headless agent
        # auth (skip != 'true'); every OTHER cell runs unconditionally — their
        # credentials are repo secrets, and a missing one is a
        # misconfiguration the runner hard-fails on, never a skip.
        if: matrix.cell.driver != 'acp' || steps.acp_preflight.outputs.skip != 'true'
        env:
          # The cell names BOTH sides of the credential seam: env_key is the
          # toolkit requireKey name for the cell's provider (ZAI_API_KEY /
          # DEEPSEEK_API_KEY — the runner CLI does not take these, the toolkit
          # driver asks for them by name); secret_name is THIS repo's Actions
          # secret carrying the key. Dynamic secret indexing is resolved at
          # STEP level (the strategy block cannot read the secrets context);
          # the `&& … || ''` guard keeps the OTHER provider's env empty on
          # every cell, so each cell only ever satisfies its own driver.
          ZAI_API_KEY: ${{ matrix.cell.env_key == 'ZAI_API_KEY' && secrets[matrix.cell.secret_name] || '' }}
          DEEPSEEK_API_KEY: ${{ matrix.cell.env_key == 'DEEPSEEK_API_KEY' && secrets[matrix.cell.secret_name] || '' }}
          MATRIX_MODEL: ${{ matrix.cell.model }}
          MATRIX_PROVIDER: ${{ matrix.cell.provider }}
          MATRIX_DRIVER: ${{ matrix.cell.driver }}
        run: |
          set -euo pipefail
          # Designed discovery (J4): the two micro suites ARE the matrix
          # payload — a SHALLOW find over their FIXED directories (-maxdepth 1:
          # only a suite.json placed DIRECTLY in a named dir runs; verified
          # against both real suites). A nested micro/x/suite.json is a
          # structuring decision for J5's designed discovery, not an accident
          # to auto-run here; widening this list stays a deliberate edit.
          hard_fail=0
          suite_count=0
          while IFS= read -r suite_file; do
            suite_dir="$(dirname "${suite_file}")"
            # G7: out dir mirrors the suite path relative to suites/, PREFIXED
            # with the cell's served model id AND driver so same-model driver
            # cells never collide on one table; the NDJSON journal (incl. the
            # honest-stop record) lands inside the same subtree. The snapshot
            # job's copy loop preserves the whole relative path, so snapshots
            # nest as <date>/<model>/<driver>/<role>/<suite>/<role>.table.json.
            rel_dir="$(dirname "${suite_file#suites/}")"
            out_dir="reports/eval/${MATRIX_MODEL}/${MATRIX_DRIVER}/${rel_dir}"
            rc=0
            # < /dev/null: this loop reads its worklist from the find's stdin
            # (while-read); a stdin-reading driver transport (the subprocess
            # or acp lane reading a prompt from stdin, say) would otherwise
            # eat the remaining suite paths mid-run.
            node --experimental-strip-types runner/index.ts \
              --suite "${suite_dir}" \
              --driver "${MATRIX_DRIVER}" \
              --driver-name "${MATRIX_DRIVER}" \
              --model "${MATRIX_MODEL}" \
              --provider "${MATRIX_PROVIDER}" \
              --max-tokens 200000 \
              --journal "${out_dir}/journal" \
              --out "${out_dir}" < /dev/null || rc=$?
            if [ "${rc}" -ge 2 ]; then
              echo "::error::suite ${MATRIX_MODEL}/${MATRIX_DRIVER}/${rel_dir}: runner usage/validation failure (exit ${rc})"
              hard_fail=1
            elif [ "${rc}" -eq 1 ]; then
              echo "::warning::suite ${MATRIX_MODEL}/${MATRIX_DRIVER}/${rel_dir} scored zero or was budget-gated"
            fi
            # Same conflation guard as the smoke loop: cliMain's exit 1 can
            # be a benign scored outcome (table emitted) OR a run-phase throw
            # mid-scoring/journal/validation (tables missing or partial).
            # rc 1 is benign ONLY when the suite completed emission — its
            # per-role table exists, including the empty-but-valid
            # budget-gated form — so the table's absence hard-fails: without
            # this, a suite dying mid-emit on the LAST suite would report job
            # success and the snapshot's full-success path would clear the
            # day's dir, replacing complete data with incomplete data.
            # rel_dir is <role>/<suite>; the role is its first segment.
            role="${rel_dir%%/*}"
            if [ ! -f "${out_dir}/${role}.table.json" ]; then
              hard_fail=1
              echo "::error::suite ${rel_dir}: rc ${rc} but no ${role}.table.json emitted — run-phase failure, not a scored outcome"
            fi
            suite_count=$((suite_count + 1))
          done < <(find suites/fixer-worker/micro suites/review-classifier/micro -maxdepth 1 -name suite.json 2>/dev/null | sort)
          # Discovery drift must be VISIBLE but never fail the cell (it is a
          # structuring signal, not an eval outcome): the list above names
          # exactly two dirs with one directly-placed suite.json each, so
          # anything but 2 is drift. Zero keeps the stronger wording — an
          # accidental REMOVAL is the urgent case.
          if [ "${suite_count}" -eq 0 ]; then
            echo "::warning::matrix discovery found no suites — if this is an accidental removal, investigate"
          elif [ "${suite_count}" -ne 2 ]; then
            echo "::warning::matrix discovery found ${suite_count} suites (expected 2) — investigate if unintended"
          fi
          # The eval-reports artifact must ALWAYS exist — even when the find
          # above came up empty (which can now only happen if the micro
          # suites vanish, warned above) or every run hard-failed pre-output
          # — so the snapshot job's download step can never 404 on a missing
          # artifact (M2). EMPTY (not a dot-file): upload-artifact v4 drops
          # hidden files unless include-hidden-files is set.
          mkdir -p reports/eval
          touch reports/eval/EMPTY
          exit "${hard_fail}"
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # PER-CELL artifact name: upload-artifact v4 requires unique names,
          # and the five matrix cells run as separate jobs — a shared name
          # would make the second uploader fail. Model+driver is the cell's
          # FULL identity (same-model driver cells must not share a name).
          # The snapshot job below re-joins the cells with a pattern download
          # (merge-multiple), which is that action's designed merge mechanism;
          # its eval-reports-* glob still matches these longer names.
          name: eval-reports-${{ matrix.cell.model }}-${{ matrix.cell.driver }}
          path: reports/
          if-no-files-found: ignore

  # Snapshot publisher: NO model code runs here — it only downloads the
  # eval-reports artifact and commits tables. Split from `matrix` so the
  # run-tool surface of fixer cells never coexists with persisted checkout
  # credentials, and the push is a pure data operation. Same
  # dispatch/schedule restriction as `matrix` (plan §9 designed flow).
  snapshot:
    needs: matrix
    # needs + !cancelled(): the snapshot runs after a FAILED matrix too. The
    # default post-failure behavior would SKIP this job on `needs: matrix`,
    # burying the surviving cell's tables — but every matrix cell uploads its
    # eval-reports-<model>-<driver> artifact `if: always()`, so whatever
    # survived a partial failure still publishes. The dispatch/schedule
    # restriction is kept INSIDE the expression (push/PR runs still never
    # reach this job) —
    # cancelling a run explicitly must not publish half a matrix, hence
    # !cancelled() rather than always().
    #
    # needs.matrix.result != 'skipped': !cancelled() OVERRIDES the default
    # skip-on-failed-need, so without this guard a dispatch run whose SMOKE
    # job failed would skip the matrix yet STILL run this job — and a skipped
    # matrix produces NO artifact at all (the EMPTY-artifact path lives
    # INSIDE the matrix job), while download-artifact v4 silently succeeds on
    # a zero-match pattern. The job would then publish empty/foreign data and
    # could even create the snapshots branch as a bare checkout copy.
    if: ${{ !cancelled() && needs.matrix.result != 'skipped' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    # Serialize snapshot-branch updates: two overlapping dispatch/schedule
    # runs would race the `snapshots` tip and one push would fail
    # non-fast-forward. Queued-not-cancelled keeps EVERY run's tables landing.
    concurrency:
      group: snapshots
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Persist the checkout token: this job's only write is the snapshot
          # commit/push, and no model code runs here.
          persist-credentials: true
      - name: Download eval reports
        # No continue-on-error: every cell that REACHED its eval step touches
        # reports/eval/EMPTY on every path, so an eval-reports-<model>-<driver>
        # artifact exists for each such cell and this download cannot fail on
        # a missing artifact. The one exception is an acp cell whose
        # preflight skipped (or hard-failed) BEFORE the eval step — that cell
        # legitimately contributes no artifact, and the pattern +
        # merge-multiple download tolerates its absence (the surviving
        # cells' artifacts still merge). A real download failure must fail
        # this job loudly. (J4: the cells upload
        # per-cell artifacts — upload-artifact v4 requires unique names; J5
        # widened the name to model+driver, which the eval-reports-* glob
        # still matches — so the pattern + merge-multiple download re-joins
        # them into reports/ exactly as the single pre-matrix artifact did.)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eval-reports-*
          merge-multiple: true
          path: reports/
      - name: Commit report snapshots
        # Plan §9: report snapshots are committed as reviewable data.
        # `[skip ci]` keeps the push from re-triggering the gate workflows
        # (no looping on our own commits).
        run: |
          set -euo pipefail
          # WHY the snapshots branch: main is hook-protected (required checks
          # static+denylist, enforce_admins) — a direct push can never land
          # once suites exist. Plan-§9 snapshots therefore land on the
          # dedicated `snapshots` branch; an owner decision to mirror them
          # onto main can come later.
          #
          # The branch setup happens BEFORE the copy: on a same-day
          # re-dispatch, `git switch` would otherwise overwrite freshly
          # copied (gitignored) files with the branch's old tracked content.
          git config user.name "cq-fixtures snapshot bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin snapshots >/dev/null 2>&1; then
            git fetch origin snapshots
            git switch -C snapshots origin/snapshots
          else
            git switch -C snapshots
          fi
          snap_dir="reports/snapshots/$(date -u +%F)"
          # A same-day re-dispatch after a suite is removed or renamed must
          # not leave the old suite's stale tables behind: clear this run's
          # dated dir (tracked on the snapshots branch) before recopying —
          # but ONLY when the matrix fully succeeded. The snapshot runs after
          # PARTIAL failures too (!cancelled()), and clearing on a degraded
          # run would destroy the failed cell's tables from an earlier
          # complete run the same day. Degraded publishes therefore MERGE
          # into the dated dir: stale tables from a same-day renamed/removed
          # suite may linger in that case — accepted, degraded publishes
          # merge; only a fully successful matrix clears its own dated dir.
          # set -u safe — snap_dir is assigned one line above; rm -rf on a
          # missing dir is a silent no-op. needs.matrix.result is a fixed
          # GitHub enum ('success'|'failure'|'cancelled'|'skipped'), safe to
          # interpolate into the script.
          # A skipped acp lane is DEGRADED even though result reads
          # 'success' (see the matrix job's outputs): merge, never clear —
          # an earlier same-day authenticated acp run's tables stay.
          if [ "${{ needs.matrix.result }}" = "success" ] && [ "${{ needs.matrix.outputs.acp_skipped }}" != "true" ]; then
            rm -rf "${snap_dir}"
          else
            echo "matrix degraded or partially succeeded (result ${{ needs.matrix.result }}, acp_skipped ${{ needs.matrix.outputs.acp_skipped }}) — merging into ${snap_dir} without clearing"
          fi
          mkdir -p "${snap_dir}"
          # Snapshot IDENTITY preserves the suite dir (the copy loop is
          # identity-agnostic — it replicates whatever sits below
          # reports/eval/): eval writes
          # reports/eval/<model>/<driver>/<role>/<suite>/<role>.table.json,
          # and flattening to the basename would collide the moment two suites
          # share a role — snapshots/<date>/<model>/<driver>/<role>/<suite>/
          # is the stable form.
          while IFS= read -r table; do
            rel="${table#reports/eval/}"
            suite_name="$(dirname "${rel}")"
            mkdir -p "${snap_dir}/${suite_name}"
            cp "${table}" "${snap_dir}/${suite_name}/"
          done < <(find reports/eval -name '*.table.json' 2>/dev/null | sort)
          # Add runs BEFORE any early exit, so removals publish too: on a
          # fully successful matrix the rm -rf above cleared the worktree, and
          # `git add` stages the removal of previously tracked tables as
          # deletions — a run that follows the removal of ALL suites therefore
          # commits and pushes its deletions instead of leaving the stale
          # dated dir on origin/snapshots. reports/* is gitignored for LOCAL
          # runs; committed snapshots are the designed exception, hence the
          # force-add.
          git add -f "${snap_dir}"
          # "Snapshots unchanged" is the ONLY no-op path: staged deletions
          # are a diff, so they commit exactly like adds. The PUSH lives
          # INSIDE the commit branch: when nothing is staged, nothing is
          # pushed. Otherwise a zero-artifact run (e.g. both matrix cells
          # failing before the eval step, so the pattern download silently
          # matches nothing) would still push and create the snapshots
          # branch as a bare checkout copy — a true no-op is the honest
          # outcome instead.
          if git diff --cached --quiet; then
            echo "snapshots unchanged — nothing to commit, nothing to push"
          else
            git commit -m "report snapshots $(date -u +%F) [skip ci]"
            git push origin HEAD:snapshots
          fi
