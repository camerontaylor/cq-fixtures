name: ci

# Invariant I4: this workflow never filters its triggers — no `paths`, no
# `paths-ignore`, no branch or tag filters. The `static` job runs on every
# push and every pull_request and is the repo's always-running required check.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pack cq-toolkit at the toolkit.lock pin
        run: ./scripts/pack-toolkit.sh
      - name: Install dependencies
        run: npm ci
      - name: Build runner dist
        # boundary.test.ts scans the BUILT dist/ output: the package-surface
        # discipline must hold through compilation, so the build precedes tests.
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Fixture gate — both-states + adequacy evidence (every case)
        # WB-6/F7 static inventory gate: every non-deprecated fixer case carries a FAULT.json
        # with complete both-states evidence and a single-statement adequacy target; every
        # record is referenced exactly once. The EXECUTING proof (buggy -> exit 1, canonical
        # fix -> exit 0, deleted statement -> red) runs in the same static job via `npm test`
        # (test/breadth.test.ts is discovery-driven over every record-backed case).
        run: node --experimental-strip-types catalog/gate.ts --check
