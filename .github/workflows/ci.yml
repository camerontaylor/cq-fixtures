name: ci

# Invariant I4: this workflow never filters its triggers — no `paths`, no
# `paths-ignore`, no branch or tag filters. The `static` job runs on every
# push and every pull_request and is the repo's always-running required check.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pack cq-toolkit at the toolkit.lock pin
        run: ./scripts/pack-toolkit.sh
      - name: Install dependencies
        run: npm ci
      - name: Build runner dist
        # boundary.test.ts scans the BUILT dist/ output: the package-surface
        # discipline must hold through compilation, so the build precedes tests.
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Classifier label drift + floors
        # F4 gate: every breadth-verified/breadth-tail case carries a
        # fixture-side label.json that agrees with its suite.json probe +
        # task.notes, adjudication records are complete, and the corpus
        # floors hold (>= 20/60 suspicious-benign, >= 6 adversarial,
        # 12/verdict). Pure node, zero deps.
        run: node scripts/check-classifier-labels.mjs
      - name: Unit tests
        run: npm test
