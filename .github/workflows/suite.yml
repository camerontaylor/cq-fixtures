name: suite

# Invariant I4: the `on:` block below carries NO filter keys — no `paths`, no
# `paths-ignore`, no branch or tag filters. push and pull_request run the
# `smoke` job unfiltered (the denylist self-test's workflow sanity scan reads
# this block, and unfiltered push runs keep the smoke green on main);
# `workflow_dispatch` and the WEEKLY `schedule` declare the real-driver
# matrix's triggers (plan §9 weekly cadence, J4: the J3 daily cron was
# reduced to a Monday-morning run now that the matrix is live; dispatch stays
# for on-demand runs). Declaring events is not filtering: the `matrix` job
# ADDITIONALLY self-restricts to dispatch/schedule via its job-level `if`, so
# push/PR runs never attempt a live eval while the `on:` block itself stays
# free of filters.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Eval profile: full runs every suite; verified runs only the breadth-verified suites'
        type: choice
        options:
          - full
          - verified
        default: full
  schedule:
    # Plan §9 weekly cadence: 03:17 UTC every Monday. workflow_dispatch stays
    # the on-demand path (an eval re-run never waits for the window).
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Pack cq-toolkit at the toolkit.lock pin
        run: ./scripts/pack-toolkit.sh
      - name: Install dependencies
        run: npm ci
      - name: Fake-driver smoke over the micro and breadth suites
        # Goal J4 replaced the J3 hard-fail seam with the REAL smoke: both
        # micro suites run under the FakeDriver — zero network, zero spend —
        # proving the whole pipeline (suite load, payload injection, judge
        # spawn, scoring, journal, aggregation) stays wired on every push and
        # every PR. F4 extends the loop to
        # suites/review-classifier/breadth-verified (30 cases, ~4 min at the
        # measured ~70 s/10-case micro pace) — breadth-tail stays
        # dispatch/matrix-only, never smoke. The fake claims --driver-name
        # subprocess per the recorded J3 decision (suites/README.md): the
        # fake stands in for a local CLI transport, so `subprocess` is the
        # honest lane label — never `ai-sdk`, the paid eval axis.
        # --check-timeout-ms 120000 gives the judge's internal 45s vitest
        # ceiling generous headroom.
        #
        # STEP-NAME STABILITY: the smoke step name is pinned by
        # test/workflow-contract.test.ts tripwire assertions — a rename must
        # update the test in the same commit (renamed in F3 to cover micro
        # and breadth suites, test updated in lockstep).
        #
        # EXIT DISCIPLINE: rc 0 (no row scored zero) and rc 1 (the suite
        # SCORED ZERO somewhere) are BOTH smoke-green. rc 1 is the honest
        # fake outcome here — and in practice ALL suites exit 1: the fake
        # cannot fix fixtures (every fixer row scores zero across its two
        # DD-4 probes), and its hardcoded 'resolved' verdict misses the 8
        # non-resolved-expected micro classifier cases and the 24
        # non-resolved-expected breadth-verified cases. A scored-zero fake
        # run IS the success signal; rc >= 2 (usage error, suite
        # load/validation failure, fixture materialization failure,
        # pre-dispatch missing-credential) is a hard failure.
        run: |
          set -euo pipefail
          hard_fail=0
          for suite_dir in suites/fixer-worker/micro suites/fixer-worker/breadth-verified suites/review-classifier/micro suites/review-classifier/breadth-verified; do
            role="$(basename "$(dirname "${suite_dir}")")"
            suite_name="$(basename "${suite_dir}")"
            # Same-role suites collide on <role>.table.json, so the out dir
            # nests per suite (F3 shape); micro keeps breadth-separated paths.
            out_dir="reports/smoke/${role}/${suite_name}"
            rc=0
            node --experimental-strip-types runner/index.ts \
              --suite "${suite_dir}" \
              --driver fake \
              --driver-name subprocess \
              --model glm-5.3-flash \
              --provider zai \
              --check-timeout-ms 120000 \
              --journal "${out_dir}/journal" \
              --out "${out_dir}" || rc=$?
            if [ "${rc}" -ge 2 ]; then
              echo "::error::smoke ${suite_dir}: runner usage/validation failure (exit ${rc})"
              hard_fail=1
            elif [ "${rc}" -eq 1 ]; then
              echo "::notice::smoke ${suite_dir}: scored zero — the honest fake outcome (the fake cannot fix)"
            fi
            # cliMain's exit 1 CONFLATES two things: a scored-zero run
            # (benign — the suite completed and emitted its table) and a
            # run-phase throw mid-scoring/journal/validation (tables missing
            # or partial). rc 1 is benign ONLY when the suite completed
            # emission — its per-role table exists, including the
            # empty-but-valid budget-gated form — so the workflow re-checks
            # instead of trusting the code: a missing table is a run-phase
            # failure and hard-fails like rc>=2.
            if [ ! -f "${out_dir}/${role}.table.json" ]; then
              hard_fail=1
              echo "::error::smoke ${suite_dir}: rc ${rc} but no ${role}.table.json emitted — run-phase failure, not a scored outcome"
            fi
          done
          exit "${hard_fail}"
      - name: Upload smoke reports
        # if: always(): a hard-failed smoke (rc>=2) still uploads whatever
        # journals/tables were written before the failure — triage evidence
        # for the case that broke the run.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-reports
          path: reports/smoke/
          if-no-files-found: ignore

  # Real drivers, dispatch/schedule ONLY: the job-level `if` is the one
  # allowed restriction here (the `on:` block above remains unfiltered — a
  # job-level `if` removes whole runs by event, which is queue/mechanics
  # territory, not an I4 trigger filter).
  matrix:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Model-driven code runs here and this job pushes nothing (the snapshot
    # publisher is the dedicated `snapshot` job), so read is enough.
    permissions:
      contents: read
    strategy:
      # One cell's hard failure must not kill the other cell's eval: the
      # surviving cell's tables are still real evidence and still land in the
      # artifacts/snapshots.
      fail-fast: false
      matrix:
        # THE J5 AXES MATRIX (ADR-0001 as revised 2026-09-14): axis 1 —
        # models vary on the ai-sdk driver; axis 2 — drivers vary on the
        # FIXED served GLM id glm-5.3-flash, over Z.AI only. Five cells: two
        # model-axis cells (ai-sdk @ glm-5.3-flash, ai-sdk @ deepseek-flash)
        # and three driver-axis cells (claude-agent / subprocess / acp @
        # glm-5.3-flash @ zai — the four-wide driver axis minus ai-sdk
        # itself). The ai-sdk@glm-5.3-flash cell carries BOTH axes'
        # evidence — it is the axis-1 model cell AND the driver axis's
        # ai-sdk point — so it runs once, not once per axis. Every
        # non-ai-sdk cell pins model glm-5.3-flash, and the runner's axis
        # guard (runner/cli.ts) refuses any other pairing per invocation;
        # `axis` records which axis a cell varies (bookkeeping, not a
        # runner input).
        #
        # LANE PREREQUISITES: the claude-agent lane needs NO install step —
        # its optional peer @anthropic-ai/claude-agent-sdk ships as a
        # devDependency (npm ci provides it). The subprocess lane spawns the
        # headless `claude` CLI (installed below); the acp lane spawns the
        # zcode-acp-server harness (installed below, version-pinned).
        #
        # Budget by TOKENS, not USD: glm-5.3-flash@zai is ABSENT from the
        # toolkit price map and the governor FAILS CLOSED on unpriced usage
        # under a USD cap (it would refuse admission after the first case of
        # any multi-case suite — the exact failure DD-9 exists to prevent),
        # and deepseek pricing must not be assumed either. A token cap binds
        # alone on every cell, keeping them dispatch-safe; the USD cap is
        # reserved for priced lanes that opt into one. The cap is PER CASE
        # (--max-tokens-per-case, WB-1.6): the retired flat 200000 was per
        # suite INVOCATION and silently gated the back half of a 40-case
        # suite into "no row" absences.
        cell:
          - axis: model
            model: glm-5.3-flash
            provider: zai
            driver: ai-sdk
            env_key: ZAI_API_KEY
            secret_name: Z_AI_API_KEY
            # F1b/WB-1: the ai-sdk fixer dispatches again on the post-#212 pin.
            # The runner classifies each driver error from its class token: an
            # unparseable structured output is an honest scored-miss row (a real
            # zero — a MODEL outcome), while a transient endpoint failure is a
            # loud dispatch-only absence. No static role skip.
          - axis: model
            # Served-id rule (2026-09-14; WB-1.5a): request the id the wire
            # SERVES. The 2026-09-18 matrix requested `deepseek-chat` and the
            # deepseek wire's classifier rows observed `deepseek-flash` (per
            # row), leaving costUSD null for the observed id — the matrix now
            # requests the served id so the observed-model seam is green; the
            # price-map entry arrives with the interim `toolkit.lock` pin
            # (WB-1.5b), so costUSD stays null until that pin lands.
            model: deepseek-flash
            provider: deepseek
            driver: ai-sdk
            env_key: DEEPSEEK_API_KEY
            secret_name: DEEPSEEK_API_KEY
            # F1b/WB-1: the deepseek fixer dispatches; #212 classifies its
            # unparseable structured output as [structured-output-miss], which
            # the runner publishes as a real scored-miss row, not a
            # driver-error zero.
          - axis: driver
            model: glm-5.3-flash
            provider: zai
            driver: claude-agent
            env_key: ZAI_API_KEY
            secret_name: Z_AI_API_KEY
            # F1b/WB-1: #211 strips the draft-2020-12 meta-schema URI, so the
            # claude-agent lane dispatches both roles again. Any remaining
            # non-model failure is a runner-classified loud absence, never a
            # static skip.
          - axis: driver
            model: glm-5.3-flash
            provider: zai
            driver: subprocess
            env_key: ZAI_API_KEY
            secret_name: Z_AI_API_KEY
            # F1b/WB-1: #213 populates WorkerResult.error on the subprocess
            # error path, so the lane dispatches both roles and a failure now
            # surfaces its cause (lane wiring, not a static skip).
          - axis: driver
            model: glm-5.3-flash
            provider: zai
            driver: acp
            env_key: ZAI_API_KEY
            secret_name: Z_AI_API_KEY
            # The acp cell is gated by its own preflight (owner decision
            # pending); every cell's driver failures are classified by the
            # runner, so no cell carries a role list.
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Model-driven code runs in this job (fixer cells get read/edit/run
          # tools) — it must not see persisted checkout credentials; report
          # tables leave via artifact, and the snapshot push lives in the
          # dedicated `snapshot` job below.
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Pack cq-toolkit at the toolkit.lock pin
        run: ./scripts/pack-toolkit.sh
      - name: Install dependencies
        run: npm ci
      - name: Excise the unit-test tree and git objects (review-debt 11)
        # The matrix job never runs vitest, but test/micro.test.ts carries the
        # micro suites' REFERENCE FIXES: a model-driven worker with
        # host-privileged tools must not be able to read them out of the
        # checkout it works in (answer lookup). So the tree is removed before
        # ANY model-facing step, in EVERY cell (this step is unconditional).
        # .git goes too: even a fetch-depth-1 clone's object store holds the
        # HEAD tree's blobs, so `git show HEAD:test/micro.test.ts` would
        # recover the excised file from .git without the network
        # (persist-credentials: false already keeps the token out; the
        # objects are the residual channel). Nothing else breaks: the runner
        # is self-contained under runner/ (test/cli.test.ts imports nothing
        # the runner needs), the eval step uses no git, and pack-toolkit.sh
        # clones fresh from the remote into its own temp dir.
        run: |
          set -euo pipefail
          echo "excising test/ and .git — the micro suites' reference fixes (test/micro.test.ts) must not be readable by model-driven workers from the worktree OR the object store (review-debt #11)"
          rm -rf test/ .git
      # LANE INSTALLS (conditional): each lane brings only its own harness.
      # The claude-agent lane deliberately has NO install step here — its
      # optional peer @anthropic-ai/claude-agent-sdk ships as a devDependency
      # (npm ci provides it), so `--driver claude-agent` works out of the box.
      - name: Install the subprocess lane CLI
        if: matrix.cell.driver == 'subprocess'
        # The subprocess lane spawns `claude` (the toolkit SubprocessDriver's
        # binary default) pointed at Z.AI's anthropic-compat endpoint — the
        # headless CLI is the claude-code package, PINNED to the exact 2.x
        # version npm resolves today (2.1.276, 2026-09-19; registry-resolved
        # at J5 — the first dispatch is the live probe), consistent with the
        # zcode-acp-server pin below.
        #
        # --allow-scripts is load-bearing (F0 triage Lane 3, WB-1.2): npm
        # 11.19 blocks lifecycle scripts by default, so the package's
        # postinstall (install.cjs — it copies the real platform binary over
        # the 500-byte `bin/claude.exe` placeholder) never ran. Every spawn
        # then exited 1 in ~0.4s with no result event, which the driver
        # mapped to `driver stopReason: error` at zero usage — the
        # subprocess cell's 2026-09-18 zeros were "CLI never installed", not
        # a model outcome. Allowing exactly this package's script keeps the
        # policy tight.
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.276
      - name: Verify the subprocess lane CLI is installed
        if: matrix.cell.driver == 'subprocess'
        # The postinstall (install.cjs) copies the real platform binary over
        # the 500-byte placeholder. If it silently did not run, every spawn
        # exits 1 with no result event and the cell publishes driver-error
        # zeros — fail HERE, loudly, instead (F0 triage Lane 3).
        run: claude --version
      - name: Install the acp lane harness
        if: matrix.cell.driver == 'acp'
        # PINNED to the probed version (2026-09-19, 0.43.3): >=0.43 moved the
        # editor-facing stdio ACP bridge into the `server` subcommand (the
        # bare bin opens its interactive TUI), and the runner passes the
        # explicit argv ['zcode-acp-server', 'server'] (runner/cli.ts
        # ACP_COMMAND) — so the installed harness must be the
        # subcommand-capable line.
        run: npm install -g zcode-acp-server@0.43.3
      - name: ACP headless auth preflight
        id: acp_preflight
        if: matrix.cell.driver == 'acp'
        # CREDENTIAL ASYMMETRY: the OTHER four cells' keys are repo secrets —
        # their absence is a misconfiguration and hard-fails pre-dispatch in
        # the runner (exit 2). The acp lane's credentials are AGENT-SIDE (the
        # zcode harness reads its own zcode-credentials app-side), and CI's
        # single GitHub identity cannot provision them from repo secrets — so
        # a blocked acp lane is an honest outcome: skip LOUDLY but green (the
        # lane is absent from the run, never published as data). The probe
        # below speaks the minimal ACP round over stdio — initialize
        # (protocolVersion 1, the ACP convention, clientCapabilities {}),
        # session/new (fresh mkdtemp cwd, mcpServers []), then session/prompt
        # — under `timeout 150` (the step keeps its own default timeout).
        # Exit-status discipline (round-2 review + Codex PR-13 P1 ×2): the SKIP
        # class is exactly TWO shapes — fail() on a json-rpc error matching
        # the LIVE-PROBED no-credentials response ("Model config is missing",
        # 2026-09-19; exit 3), and the timeout's own branch (rc 124: "blocked,
        # cause not established" — not labeled credentials). EVERYTHING ELSE
        # is a HARD failure (exit 4, loud): a spawn error, any OTHER json-rpc
        # error (protocol regression, provider outage, harness bug), an
        # UNEXPLAINED close before any agent line, and any unexpected
        # non-zero — a broken harness can never silently vanish from the
        # matrix as a credential skip.
        run: |
          set -euo pipefail
          rc=0
          timeout 150 node -e '
            const { spawn } = require("node:child_process");
            const { mkdirSync, mkdtempSync, writeFileSync } = require("node:fs");
            const { tmpdir } = require("node:os");
            const { join } = require("node:path");
            const child = spawn("zcode-acp-server", ["server"], { stdio: ["pipe", "pipe", "pipe"] });
            const stderr = [];
            child.stderr.on("data", (d) => { stderr.push(d.toString()); if (stderr.length > 40) stderr.shift(); });
            let stage = 0; // 0 initialize sent, 1 session/new sent, 2 prompt sent
            const fail = (why, code = 3) => {
              console.error("acp preflight FAILED: " + why);
              if (stderr.length > 0) console.error(stderr.join(""));
              process.exit(code);
            };
            child.on("error", (e) => { console.error("acp preflight FAILED: spawn error: " + e.message); process.exit(4); });
            // close, not exit: close fires after stdio flushes, so an agent
            // line arriving just before the harness dies is still processed
            // by the stdout handler above. An unexplained close is exit 4
            // (infrastructure), NOT the credential skip: the live-probed
            // credential-less harness fails via the json-rpc missing-config
            // response — a silent close is a crash/outage/regression and
            // must fail the cell loudly (Codex PR-13 round-2 P1).
            child.on("close", (code) => fail("harness closed (code " + code + ") without any agent output", 4));
            // A dying harness must not surface as an unhandled EPIPE on the
            // queued send()s — close/timeout own the verdict (cycle-1 r1
            // finding 3): the error listener absorbs it.
            child.stdin.on("error", () => {});
            const send = (m) => child.stdin.write(JSON.stringify(m) + "\n");
            send({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: 1, clientCapabilities: {} } });
            let out = "";
            child.stdout.on("data", (d) => {
              out += d.toString();
              let i;
              while ((i = out.indexOf("\n")) !== -1) {
                const line = out.slice(0, i).trim();
                out = out.slice(i + 1);
                if (line === "") continue;
                let msg;
                // Auth-OK is a JSON-RPC MESSAGE at stage 2 — never any
                // parsed-less stdout line: a login-blocked harness that
                // narrates to stdout ("visit … to log in") must NOT flip the
                // cell to authenticated (cycle-2 r1 finding 1) — the timeout
                // owns non-JSON output.
                try { msg = JSON.parse(line); } catch { continue; }
                if (msg.error !== undefined) {
                  const detail = JSON.stringify(msg.error);
                  // The exact live-probed marker ONLY (2026-09-19): a loose
                  // substring like config.json would convert ANY config
                  // regression (malformed/unreadable file) into a credential
                  // skip (Codex PR-13 round-3 P1).
                  if (/Model config is missing/.test(detail)) {
                    fail("json-rpc error: model config missing (probed no-credentials shape): " + detail, 3);
                  }
                  fail("json-rpc error before any agent output (infrastructure): " + detail, 4);
                }
                if (stage === 0 && msg.id === 1) {
                  stage = 1;
                  send({ jsonrpc: "2.0", id: 2, method: "session/new", params: { cwd: mkdtempSync(join(tmpdir(), "acp-preflight-")), mcpServers: [] } });
                } else if (stage === 1 && msg.id === 2) {
                  stage = 2;
                  send({ jsonrpc: "2.0", id: 3, method: "session/prompt", params: { sessionId: msg.result.sessionId, prompt: [{ type: "text", text: "Reply with the single word ready." }] } });
                } else if (stage === 2) {
                  // Auth-OK requires the AGENT REPLY (agent_message_chunk) —
                  // a session/protocol message alone proves nothing: probed
                  // live (2026-09-19), the harness streams bookkeeping like
                  // available_commands_update with ZERO credentials, so only
                  // the reply is accepted; bookkeeping keeps waiting and the
                  // timeout owns it (skip class). NO APOSTROPHES may appear
                  // anywhere in this script: it rides inside a shell
                  // single-quoted string (CodeRabbit PR-13 catch — one
                  // apostrophe turned the whole preflight into a bash
                  // syntax error).
                  const upd = msg.params && msg.params.update;
                  if (upd !== undefined && upd.sessionUpdate === "agent_message_chunk") {
                    // Review-debt #14: this probe IS a real model request,
                    // and it runs before the runner exists — so its spend
                    // would sit outside the cell --max-tokens governor and
                    // the NDJSON journal with no usage recorded. Its exact
                    // usage is unmeasurable (first-chunk exit), so the eval
                    // step accounts it as the runner --probe-record: a
                    // conservative reservation admitted through the same
                    // governor and journaled with the run. The record rides
                    // the eval artifact beside ACP-SKIPPED (same
                    // last-writer-wins rationale — never a job output), and
                    // the snapshot copy loop ignores it (*.table.json only).
                    // NO APOSTROPHES in this addition either (single-quoted
                    // shell string, same as the rest of this script).
                    const promptText = "Reply with the single word ready.";
                    const record = {
                      probe: "acp-auth-preflight",
                      at: new Date().toISOString(),
                      promptChars: promptText.length,
                      replyChars: line.length,
                      replyPreview: line.slice(0, 200)
                    };
                    mkdirSync("reports/eval", { recursive: true });
                    writeFileSync("reports/eval/ACP-PROBE.json", JSON.stringify(record, null, 2) + "\n");
                    console.log(line);
                    process.exit(0);
                  }
                }
              }
            });
          ' || rc=$?
          # The skip signal rides the ARTIFACT (reports/eval/ACP-SKIPPED,
          # uploaded by the always-on upload step below), NOT a matrix job
          # output: GitHub merges same-named outputs of matrix legs
          # LAST-WRITER-WINS, and four of the five legs would write 'false'
          # — a later eval leg would erase the acp leg's skip and the
          # snapshot's clear-on-success would wipe an earlier same-day
          # authenticated acp run (round-2 r2 finding 1). The marker file
          # never publishes: the snapshot's copy loop takes *.table.json
          # only.
          if [ "${rc}" -eq 124 ]; then
            # HONEST DIAGNOSIS (round-2 r2 finding 2): a window expiry is a
            # blocked lane, NOT an established credential cause — say so.
            echo "::warning::acp cell blocked: no agent output within 150s — treated as blocked, cause not established"
            echo "acp lane skipped: no agent output within 150s — treated as blocked; the lane is honestly absent from this run, never published as data" >> "${GITHUB_STEP_SUMMARY}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            mkdir -p reports/eval && touch reports/eval/ACP-SKIPPED
          elif [ "${rc}" -eq 3 ]; then
            echo "::warning::acp cell blocked: no headless agent credentials (zcode-credentials cannot be provisioned from repo secrets)"
            echo "acp lane skipped: no headless agent credentials in CI (agent-side auth) — the lane is honestly absent from this run, never published as data" >> "${GITHUB_STEP_SUMMARY}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            mkdir -p reports/eval && touch reports/eval/ACP-SKIPPED
          elif [ "${rc}" -ne 0 ]; then
            # Spawn failures (4), script crashes, any unexpected status: a
            # broken preflight must never silently omit the acp lane — fail.
            echo "::error::acp preflight failed (rc ${rc}) — infrastructure, not a credential skip"
            exit 1
          fi
          # Review-debt #14: an auth-OK probe (rc 0) MUST leave its record
          # behind — the eval step accounts the probe against the cell token
          # cap from it, and the runner fails loud without it. A missing
          # record here is infrastructure, never a silent skip.
          if [ "${rc}" -eq 0 ] && [ ! -f reports/eval/ACP-PROBE.json ]; then
            echo "::error::acp preflight authed but wrote no probe record — the eval cell cannot account the probe"
            exit 1
          fi
      # CREDENTIAL PREREQUISITE (the J3 BLOCKED note, carried forward): both
      # secret NAMES must exist in THIS repo's Actions settings — Z_AI_API_KEY
      # (the zai key) and DEEPSEEK_API_KEY. A missing or empty secret maps to
      # '' below, which the toolkit's requireKey rejects exactly like an
      # unset var, so the cell aborts PRE-DISPATCH with exit 2 (hard failure)
      # instead of publishing zero-scored tables while green.
      #
      # ACCEPTED RISK (recorded): the provider API key sits in this job's
      # env — and fixer cells hand model-driven workers read/edit/run tools
      # — so a prompt-injected worker could exfiltrate the key from the
      # process environment. Accepted because suite prompts are first-party
      # fixtures (provenance-marked, no third-party content). Owner action
      # tracked: move cells to a spend-capped, ephemeral eval key. The
      # credential split already keeps repo write access out of this job
      # (persist-credentials: false).
      - name: Eval cell — ${{ matrix.cell.model }} @ ${{ matrix.cell.provider }} on ${{ matrix.cell.driver }}
        # The acp cell runs ONLY if the preflight above proved headless agent
        # auth (skip != 'true'); every OTHER cell runs unconditionally — their
        # credentials are repo secrets, and a missing one is a
        # misconfiguration the runner hard-fails on, never a skip.
        if: matrix.cell.driver != 'acp' || steps.acp_preflight.outputs.skip != 'true'
        env:
          # The cell names BOTH sides of the credential seam: env_key is the
          # toolkit requireKey name for the cell's provider (ZAI_API_KEY /
          # DEEPSEEK_API_KEY — the runner CLI does not take these, the toolkit
          # driver asks for them by name); secret_name is THIS repo's Actions
          # secret carrying the key. Dynamic secret indexing is resolved at
          # STEP level (the strategy block cannot read the secrets context);
          # the `&& … || ''` guard keeps the OTHER provider's env empty on
          # every cell, so each cell only ever satisfies its own driver.
          ZAI_API_KEY: ${{ matrix.cell.env_key == 'ZAI_API_KEY' && secrets[matrix.cell.secret_name] || '' }}
          DEEPSEEK_API_KEY: ${{ matrix.cell.env_key == 'DEEPSEEK_API_KEY' && secrets[matrix.cell.secret_name] || '' }}
          MATRIX_MODEL: ${{ matrix.cell.model }}
          MATRIX_PROVIDER: ${{ matrix.cell.provider }}
          MATRIX_DRIVER: ${{ matrix.cell.driver }}
          MATRIX_PROFILE: ${{ github.event.inputs.profile || 'full' }}
        run: |
          set -euo pipefail
          # Designed discovery (J4/F3/F4): a SHALLOW find over FIXED suite dirs
          # (-maxdepth 1: only a suite.json placed DIRECTLY in a named dir
          # runs). The dispatch input `profile` selects the roots (F3,
          # WB-2.5): `verified` runs only the breadth-verified suites; `full`
          # (the default, and the weekly schedule's value) runs every suite.
          # F4 adds the classifier breadth suites: breadth-verified rides
          # both profiles, breadth-tail is full-only (dispatch/matrix).
          # Declaring the roots explicitly keeps widening a deliberate edit.
          #
          # deprecated/ exclusion (F2, WB-2.1): retirement moves a case to a
          # sibling deprecated/ suite (deprecate-don't-renumber), and a retired
          # case must NEVER spend weekly tokens. -not -path drops any suite
          # whose path carries a deprecated/ segment.
          hard_fail=0
          suite_count=0
          case "${MATRIX_PROFILE}" in
            verified) roots="suites/fixer-worker/breadth-verified suites/review-classifier/breadth-verified" ;;
            full) roots="suites/fixer-worker/micro suites/review-classifier/micro suites/fixer-worker/breadth-verified suites/fixer-worker/breadth-tail suites/review-classifier/breadth-verified suites/review-classifier/breadth-tail" ;;
            *) echo "::error::unknown profile '${MATRIX_PROFILE}' (expected verified|full)"; exit 2 ;;
          esac
          # Review-debt #14: the acp preflight probe spent real inference
          # before this step — its record rides into the runner so the probe
          # is admitted through the same governor and journaled with the run
          # instead of spending off-books. Other cells ran no probe; the
          # flag is acp-only (the runner exits 2 on a missing record file,
          # and the preflight hard-fails above when auth-OK leaves none).
          probe_extra=()
          if [ "${MATRIX_DRIVER}" = "acp" ]; then
            probe_extra=(--probe-record reports/eval/ACP-PROBE.json)
          fi
          # The runner-driven absence branch below touches a DISPATCH-ONLY
          # marker under reports/eval when a non-model driver cause published
          # no row, so the dir must exist before the loop — the end-of-loop
          # mkdir is too late under `set -e`.
          mkdir -p reports/eval
          while IFS= read -r suite_file; do
            suite_dir="$(dirname "${suite_file}")"
            # G7: out dir mirrors the suite path relative to suites/, PREFIXED
            # with the cell's served model id AND driver so same-model driver
            # cells never collide on one table; the NDJSON journal (incl. the
            # honest-stop record) lands inside the same subtree. F6/CQ-4: a
            # non-default suite `variant` adds a <variant>/ segment right after
            # the driver, so two postures of one suite never overwrite each
            # other; the default posture keeps the pre-F6 path exactly. The
            # snapshot job's copy loop preserves the whole relative path, so
            # snapshots nest as
            # <date>/<model>/<driver>/<variant?>/<role>/<suite>/<role>.table.json.
            rel_dir="$(dirname "${suite_file#suites/}")"
            # The variant comes from the suite.json the runner will also load.
            # It must be a path-safe slug (the suite schema enforces the same
            # pattern): an unsafe value fails the cell loudly here rather than
            # escaping reports/eval.
            variant="$(node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(s.variant||"default")' "${suite_dir}/suite.json")" || { echo "::error::suite ${suite_dir}: could not read the suite.json variant"; hard_fail=1; continue; }
            if ! printf '%s' "${variant}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              echo "::error::suite ${suite_dir}: invalid variant '${variant}' (path-safe slug required)"
              hard_fail=1
              continue
            fi
            variant_prefix=""
            if [ "${variant}" != "default" ]; then variant_prefix="${variant}/"; fi
            out_dir="reports/eval/${MATRIX_MODEL}/${MATRIX_DRIVER}/${variant_prefix}${rel_dir}"
            # rel_dir is <role>/<suite>; the role is its first segment.
            role="${rel_dir%%/*}"
            # Discovery drift counts SUITES FOUND, before any skip decision.
            suite_count=$((suite_count + 1))
            rc=0
            # < /dev/null: this loop reads its worklist from the find's stdin
            # (while-read); a stdin-reading driver transport (the subprocess
            # or acp lane reading a prompt from stdin, say) would otherwise
            # eat the remaining suite paths mid-run.
            # WB-1.6 per-case token budget. The runner multiplies this by the
            # suite's loaded case count (--max-tokens-per-case), so the cap
            # scales with suite size instead of gating a 40-case suite's tail
            # after ~5k tokens/case. 60000 = 5x the worst observed 2026-09-18
            # per-case total (10441 tokens: deepseek ai-sdk fixer, 52203/5,
            # all four governor-counted fields), rounded up; those runs were
            # ERRORED partial tool loops, so the observed figure is a LOWER
            # bound and the headroom covers a completed 8-step loop. Control:
            # the healthy glm classifier cell spent 776 tokens/case (7756/10)
            # — ~77x under this budget. Micro: fixer 5x60000=300000,
            # classifier 10x60000=600000, both above the retired flat 200000.
            node --experimental-strip-types runner/index.ts \
              --suite "${suite_dir}" \
              --driver "${MATRIX_DRIVER}" \
              --driver-name "${MATRIX_DRIVER}" \
              --model "${MATRIX_MODEL}" \
              --provider "${MATRIX_PROVIDER}" \
              --max-tokens-per-case 60000 \
              --journal "${out_dir}/journal" \
              "${probe_extra[@]}" \
              --out "${out_dir}" < /dev/null || rc=$?
            if [ "${rc}" -ge 2 ]; then
              echo "::error::suite ${MATRIX_MODEL}/${MATRIX_DRIVER}/${rel_dir}: runner usage/validation failure (exit ${rc})"
              hard_fail=1
            elif [ "${rc}" -eq 1 ]; then
              echo "::warning::suite ${MATRIX_MODEL}/${MATRIX_DRIVER}/${rel_dir} scored zero or was budget-gated"
            fi
            # Same conflation guard as the smoke loop: cliMain's exit 1 can
            # be a benign scored outcome (table emitted) OR a run-phase throw
            # mid-scoring/journal/validation (tables missing or partial).
            # rc 1 is benign ONLY when the suite completed emission — its
            # per-role table exists, including the empty-but-valid
            # budget-gated form — so the table's absence hard-fails: without
            # this, a suite dying mid-emit on the LAST suite would report job
            # success and the snapshot's full-success path would clear the
            # day's dir, replacing complete data with incomplete data.
            # rel_dir is <role>/<suite>; the role is its first segment.
            if [ ! -f "${out_dir}/${role}.table.json" ]; then
              hard_fail=1
              echo "::error::suite ${rel_dir}: rc ${rc} but no ${role}.table.json emitted — run-phase failure, not a scored outcome"
            fi
            # F1b (WB-1) runner-side class mapping: a driver error whose cause
            # is not the model's unparseable structured output published NO row
            # — a loud dispatch-only absence, never a fabricated zero.
            # runner/cli.ts records each such case in run.json's absences[];
            # render it as a warning + step-summary line and drop the marker so
            # the snapshot job never clears a same-day dir that held real data
            # for the role. A malformed run.json is our own bug: fail loudly.
            if [ -f "${out_dir}/run.json" ]; then
              absent_lines="$(node -e '
                const fs = require("node:fs");
                const doc = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const lines = [];
                for (const run of doc.runs || []) {
                  for (const a of run.absences || []) {
                    lines.push(`${run.model}@${run.driver} ${run.role} case ${a.case}: ${String(a.cause).replace(/[\r\n]+/g, " ")}`);
                  }
                }
                process.stdout.write(lines.join("\n"));
              ' "${out_dir}/run.json")"
              if [ -n "${absent_lines}" ]; then
                while IFS= read -r absent_line; do
                  echo "::warning::${absent_line} (dispatch-only absence — no row published)"
                  # The endpoint's cause text is untrusted: escape HTML before
                  # it reaches the markdown step summary (annotation lines stay raw).
                  escaped="$(printf '%s' "${absent_line}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')"
                  echo "- dispatch-only absence: ${escaped}" >> "${GITHUB_STEP_SUMMARY}"
                done <<< "${absent_lines}"
                touch "reports/eval/DISPATCH-ONLY-${MATRIX_MODEL}-${MATRIX_DRIVER}-${role}"
              fi
            fi
          # shellcheck disable=SC2086 — ${roots} is intentionally word-split
          # into the profile's suite dirs; quoting it would make find look for
          # one path named "a b c".
          done < <(find ${roots} -maxdepth 1 -name suite.json -not -path '*/deprecated/*' 2>/dev/null | sort)
          # Discovery drift is VISIBLE: a count other than the profile's
          # expected count is a WARNING (a later phase adding a suite is a
          # structuring change, not an eval failure). ZERO suites is the
          # urgent case — an accidental removal or a broken root would
          # otherwise let the cell succeed with no tables and the snapshot's
          # full-success path clear the day's dir — so zero HARD-FAILS the
          # cell (the snapshot job still runs on a failed matrix and merges
          # surviving tables).
          expected_count=6
          if [ "${MATRIX_PROFILE}" = "verified" ]; then expected_count=2; fi
          if [ "${suite_count}" -eq 0 ]; then
            hard_fail=1
            echo "::error::matrix discovery found no suites for profile ${MATRIX_PROFILE} — an accidental removal or a broken root; failing the cell so the snapshot cannot publish an empty day"
          elif [ "${suite_count}" -ne "${expected_count}" ]; then
            echo "::warning::matrix discovery found ${suite_count} suites (expected ${expected_count} for profile ${MATRIX_PROFILE}) — investigate if unintended"
          fi
          # The eval-reports artifact must ALWAYS exist — even when the find
          # above came up empty (which can now only happen if the micro
          # suites vanish, warned above) or every run hard-failed pre-output
          # — so the snapshot job's download step can never 404 on a missing
          # artifact (M2). EMPTY (not a dot-file): upload-artifact v4 drops
          # hidden files unless include-hidden-files is set.
          mkdir -p reports/eval
          touch reports/eval/EMPTY
          exit "${hard_fail}"
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # PER-CELL artifact name: upload-artifact v4 requires unique names,
          # and the five matrix cells run as separate jobs — a shared name
          # would make the second uploader fail. Model+driver is the cell's
          # FULL identity (same-model driver cells must not share a name).
          # The snapshot job below re-joins the cells with a pattern download
          # (merge-multiple), which is that action's designed merge mechanism;
          # its eval-reports-* glob still matches these longer names.
          name: eval-reports-${{ matrix.cell.model }}-${{ matrix.cell.driver }}
          path: reports/
          if-no-files-found: ignore

  # Snapshot publisher: NO model code runs here — it only downloads the
  # eval-reports artifact and commits tables. Split from `matrix` so the
  # run-tool surface of fixer cells never coexists with persisted checkout
  # credentials, and the push is a pure data operation. Same
  # dispatch/schedule restriction as `matrix` (plan §9 designed flow).
  snapshot:
    needs: matrix
    # needs + !cancelled(): the snapshot runs after a FAILED matrix too. The
    # default post-failure behavior would SKIP this job on `needs: matrix`,
    # burying the surviving cell's tables — but every matrix cell uploads its
    # eval-reports-<model>-<driver> artifact `if: always()`, so whatever
    # survived a partial failure still publishes. The dispatch/schedule
    # restriction is kept INSIDE the expression (push/PR runs still never
    # reach this job) —
    # cancelling a run explicitly must not publish half a matrix, hence
    # !cancelled() rather than always().
    #
    # needs.matrix.result != 'skipped': !cancelled() OVERRIDES the default
    # skip-on-failed-need, so without this guard a dispatch run whose SMOKE
    # job failed would skip the matrix yet STILL run this job — and a skipped
    # matrix produces NO artifact at all (the EMPTY-artifact path lives
    # INSIDE the matrix job), while download-artifact v4 silently succeeds on
    # a zero-match pattern. The job would then publish empty/foreign data and
    # could even create the snapshots branch as a bare checkout copy.
    if: ${{ !cancelled() && needs.matrix.result != 'skipped' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    # Serialize snapshot-branch updates: two overlapping dispatch/schedule
    # runs would race the `snapshots` tip and one push would fail
    # non-fast-forward. Queued-not-cancelled keeps EVERY run's tables landing.
    concurrency:
      group: snapshots
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Persist the checkout token: this job's only write is the snapshot
          # commit/push, and no model code runs here.
          persist-credentials: true
      - name: Download eval reports
        # No continue-on-error: every cell that REACHED its eval step touches
        # reports/eval/EMPTY on every path, so an eval-reports-<model>-<driver>
        # artifact exists for each such cell and this download cannot fail on
        # a missing artifact. The one exception is an acp cell whose
        # preflight skipped (or hard-failed) BEFORE the eval step — that cell
        # legitimately contributes no artifact, and the pattern +
        # merge-multiple download tolerates its absence (the surviving
        # cells' artifacts still merge). A real download failure must fail
        # this job loudly. (J4: the cells upload
        # per-cell artifacts — upload-artifact v4 requires unique names; J5
        # widened the name to model+driver, which the eval-reports-* glob
        # still matches — so the pattern + merge-multiple download re-joins
        # them into reports/ exactly as the single pre-matrix artifact did.)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eval-reports-*
          merge-multiple: true
          path: reports/
      - name: Commit report snapshots
        # Plan §9: report snapshots are committed as reviewable data.
        # `[skip ci]` keeps the push from re-triggering the gate workflows
        # (no looping on our own commits).
        run: |
          set -euo pipefail
          # WHY the snapshots branch: main is hook-protected (required checks
          # static+denylist, enforce_admins) — a direct push can never land
          # once suites exist. Plan-§9 snapshots therefore land on the
          # dedicated `snapshots` branch; an owner decision to mirror them
          # onto main can come later.
          #
          # The branch setup happens BEFORE the copy: on a same-day
          # re-dispatch, `git switch` would otherwise overwrite freshly
          # copied (gitignored) files with the branch's old tracked content.
          git config user.name "cq-fixtures snapshot bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin snapshots >/dev/null 2>&1; then
            git fetch origin snapshots
            git switch -C snapshots origin/snapshots
          else
            git switch -C snapshots
          fi
          snap_dir="reports/snapshots/$(date -u +%F)"
          # A same-day re-dispatch after a suite is removed or renamed must
          # not leave the old suite's stale tables behind: clear this run's
          # dated dir (tracked on the snapshots branch) before recopying —
          # but ONLY when the matrix fully succeeded. The snapshot runs after
          # PARTIAL failures too (!cancelled()), and clearing on a degraded
          # run would destroy the failed cell's tables from an earlier
          # complete run the same day. Degraded publishes therefore MERGE
          # into the dated dir: stale tables from a same-day renamed/removed
          # suite may linger in that case — accepted, degraded publishes
          # merge; only a fully successful matrix clears its own dated dir.
          # set -u safe — snap_dir is assigned one line above; rm -rf on a
          # missing dir is a silent no-op. needs.matrix.result is a fixed
          # GitHub enum ('success'|'failure'|'cancelled'|'skipped'), safe to
          # interpolate into the script.
          # A skipped acp lane is DEGRADED even though result reads
          # 'success': the preflight drops reports/eval/ACP-SKIPPED into the
          # eval artifact (job outputs would be last-writer-wins across the
          # matrix legs — see the preflight comment), and a skip means
          # MERGE, never clear — an earlier same-day authenticated acp run's
          # tables stay.
          dispatch_only_marker="$(find reports/eval -maxdepth 1 -name 'DISPATCH-ONLY-*' -print -quit 2>/dev/null)"
          if [ "${{ needs.matrix.result }}" = "success" ] && [ ! -e reports/eval/ACP-SKIPPED ] && [ -z "${dispatch_only_marker}" ]; then
            rm -rf "${snap_dir}"
          else
            echo "matrix degraded or partially succeeded (result ${{ needs.matrix.result }}, acp skip marker: $([ -e reports/eval/ACP-SKIPPED ] && echo present || echo absent), dispatch-only marker: ${dispatch_only_marker:-none}) — merging into ${snap_dir} without clearing"
          fi
          mkdir -p "${snap_dir}"
          # Snapshot IDENTITY preserves the suite dir (the copy loop is
          # identity-agnostic — it replicates whatever sits below
          # reports/eval/): eval writes
          # reports/eval/<model>/<driver>/<variant?>/<role>/<suite>/... and
          # flattening to the basename would collide the moment two suites
          # share a role — snapshots/<date>/<model>/<driver>/<variant?>/<role>/
          # <suite>/ is the stable form. F6 (WB-5.2a/5.1): the snapshot carries
          # the run's PREDICTIONS and provenance beside the tables — rows.jsonl
          # (the regrade input), run.json (the suite + toolkit.lock/suite-SHA
          # manifest), and the worker's patches/ and outputs/ artifacts. The
          # ACP-SKIPPED / ACP-PROBE.json / EMPTY markers do NOT match these
          # predicates and stay in the artifact only. F1b (WB-1): an
          # empty-but-valid table whose run.json records dispatch-only
          # absences is withheld below (the absence lives in run.json, never
          # as a zero-cell data table).
          while IFS= read -r f; do
            # F1b (WB-1): a suite whose cases ALL became dispatch-only
            # absences emits an empty-but-valid <role>.table.json (cells: [])
            # plus a run.json whose runs[].absences records the causes.
            # Publish the absence record, never the zero-cell table: a data
            # table that reads as "0 cases" would misrepresent infrastructure
            # as an outcome. Non-empty tables and clean (absence-free) empty
            # tables are copied unchanged.
            if [[ "${f}" == *.table.json ]]; then
              # A missing or malformed sibling run.json FAILS the snapshot
              # step (::error:: + exit 1): the table's absence metadata is
              # unknown, so publishing it could present a zero-cell table as
              # clean data. The eval cell should have failed on the same
              # condition; this is the defense for a partially uploaded
              # artifact. The node helper must NOT swallow read/parse errors.
              if ! table_fate="$(node -e '
                const fs = require("node:fs");
                const path = require("node:path");
                const table = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const manifest = JSON.parse(fs.readFileSync(path.join(path.dirname(process.argv[1]), "run.json"), "utf8"));
                const hasAbsences = (manifest.runs || []).some((r) => (r.absences || []).length > 0);
                process.stdout.write((table.cells || []).length === 0 && hasAbsences ? "skip" : "keep");
              ' "${f}")"; then
                echo "::error::snapshot: cannot read run.json beside ${f#reports/eval/} — refusing to publish a table without its absence metadata"
                exit 1
              fi
              if [ "${table_fate}" = "skip" ]; then
                echo "snapshot: skipping empty dispatch-only table ${f#reports/eval/} (absences recorded in run.json)"
                continue
              fi
            fi
            rel="${f#reports/eval/}"
            mkdir -p "${snap_dir}/$(dirname "${rel}")"
            cp "${f}" "${snap_dir}/${rel}"
          done < <(find reports/eval -type f \( -name '*.table.json' -o -name 'rows.jsonl' -o -name 'run.json' -o -path '*/patches/*' -o -path '*/outputs/*' \) 2>/dev/null | sort)
          # Add runs BEFORE any early exit, so removals publish too: on a
          # fully successful matrix the rm -rf above cleared the worktree, and
          # `git add` stages the removal of previously tracked tables as
          # deletions — a run that follows the removal of ALL suites therefore
          # commits and pushes its deletions instead of leaving the stale
          # dated dir on origin/snapshots. reports/* is gitignored for LOCAL
          # runs; committed snapshots are the designed exception, hence the
          # force-add.
          git add -f "${snap_dir}"
          # "Snapshots unchanged" is the ONLY no-op path: staged deletions
          # are a diff, so they commit exactly like adds. The PUSH lives
          # INSIDE the commit branch: when nothing is staged, nothing is
          # pushed. Otherwise a zero-artifact run (e.g. both matrix cells
          # failing before the eval step, so the pattern download silently
          # matches nothing) would still push and create the snapshots
          # branch as a bare checkout copy — a true no-op is the honest
          # outcome instead.
          if git diff --cached --quiet; then
            echo "snapshots unchanged — nothing to commit, nothing to push"
          else
            git commit -m "report snapshots $(date -u +%F) [skip ci]"
            git push origin HEAD:snapshots
          fi
